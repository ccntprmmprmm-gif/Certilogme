<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check authenticity</title>
<style>
:root{--bg:#fff;--fg:#111;--muted:#555;--btn:#000;--btnfg:#fff;--line:#ccc;--hero1:#1b1b1b;--hero2:#4a4a2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#f4f4f4;--muted:#aaa;--btn:#fff;--btnfg:#000;--line:#444}
:root:not([data-theme="light"]) .brand img{filter:invert(1)}}
:root[data-theme="dark"]{--bg:#111;--fg:#f4f4f4;--muted:#aaa;--btn:#fff;--btnfg:#000;--line:#444}
:root[data-theme="dark"] .brand img{filter:invert(1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:300;overflow:hidden}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
/* welcome */
.brand{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:26px;letter-spacing:.5px;text-align:center;padding:16px 0 12px;text-transform:uppercase}
.brand img{display:block;margin:0 auto;height:auto;width:min(34%,170px)}
.hero{background:#000;aspect-ratio:719/473;max-height:42vh;width:100%;overflow:hidden}
.hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.welcome-text{padding:34px 18px 0;text-align:center}
.welcome-text h1{font-size:14px;font-weight:700;letter-spacing:.2px;margin:0 0 12px}
.welcome-text p{margin:0 auto 26px;font-size:14px;line-height:1.45;color:var(--muted);max-width:320px}
.field{width:100%;padding:13px 14px;font:inherit;font-size:15px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:0;margin-bottom:10px;text-align:center;letter-spacing:1px}
.field:focus-visible,.btn:focus-visible{outline:2px solid #3a86ff;outline-offset:2px}
.btn{width:100%;padding:15px;font:inherit;font-size:14px;font-weight:500;background:var(--btn);color:var(--btnfg);border:0;border-radius:0;cursor:pointer}
.err{min-height:18px;font-size:13px;color:#c0392b;margin:0 0 8px}
/* result */
#result{background:#fff}
#cv{position:absolute;inset:0;width:100%;height:100%}
#grad{position:absolute;inset:0;opacity:0;transition:opacity .9s}
#result.done #grad{opacity:1}
.mark{position:absolute;top:calc(50% - 23px);left:calc(50% - 23px);width:46px;height:46px;transition:all 1s cubic-bezier(.6,0,.2,1)}
.mark b{position:absolute;width:14px;height:14px;border:0 solid #000;transition:border-color .6s}
.mark b:nth-child(1){top:0;left:0;border-width:3px 0 0 3px}.mark b:nth-child(2){top:0;right:0;border-width:3px 3px 0 0}
.mark b:nth-child(3){bottom:0;left:0;border-width:0 0 3px 3px}.mark b:nth-child(4){bottom:0;right:0;border-width:0 3px 3px 0}
.mark em{position:absolute;inset:11px;border-radius:38% 42% 40% 44%;background:radial-gradient(circle at 30% 40%,#2a1a55 0 18%,transparent 19%),linear-gradient(135deg,#7a4fd6,#3ec0e8 70%,#5fd3a0)}
#result.shrink .mark{top:calc(8% + 6px);left:7%;width:34px;height:34px;transform:none}
#result.shrink .mark b{border-color:#fff}
#result.shrink .mark em{inset:8px}
#rlogo{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);width:min(34%,170px);height:auto;filter:brightness(0) invert(1);opacity:0;transition:opacity .8s}
#rmenu{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);right:16px;width:22px;height:16px;opacity:0;transition:opacity .8s}
#rl{position:absolute;top:calc(38% + 62px);left:50%;transform:translateX(-50%);width:min(72%,320px);height:2px;background:rgba(255,255,255,.35);opacity:0;transition:opacity .5s}
#rl i{display:block;height:100%;width:0;background:#fff}
#result.load #rl{opacity:1}#result.load #rl i{width:100%;transition:width 2.2s linear}
#rt{position:absolute;top:38%;left:0;right:0;text-align:center;font-size:36px;font-weight:300;color:#fff;opacity:0;transition:opacity .8s}
#rs{position:absolute;top:calc(38% + 90px);left:0;right:0;text-align:center;font-size:15px;color:#fff;opacity:0;transition:opacity .8s .3s;padding:0 24px}
#result.txt #rlogo,#result.txt #rmenu,#result.txt #rt,#result.txt #rs{opacity:1}
/* final */
#final{overflow-y:auto;background:var(--bg)}
#final.on{display:block;animation:fin .7s ease both}
@keyframes fin{from{opacity:0}to{opacity:1}}
.fbar{height:56px;display:flex;align-items:center;justify-content:flex-end;padding:0 16px}
.fbar svg{width:22px;height:16px;stroke:var(--fg)}
#fimg{display:block;width:100%;aspect-ratio:719/473;object-fit:cover;background:#000}
.fmsg{text-align:center;font-size:16px;padding:22px 0 26px;font-weight:400;letter-spacing:.2px}
.fbtns{padding:0 26px 26px}
.fbtns .btn{display:block;margin-bottom:14px;padding:22px 10px;text-transform:uppercase;font-weight:500;letter-spacing:.2px}
.fbtns .btn.o{background:transparent;color:var(--fg);border:1px solid var(--fg)}
.follow{background:#000;color:#fff;text-align:center;padding:14px 0 26px;font-size:14px}
.follow div{display:flex;justify-content:center;gap:28px;margin-top:12px}
.follow svg{width:34px;height:34px;fill:#fff}
.follow svg.st{fill:none;stroke:#fff;stroke-width:2}
.again2{display:block;margin:16px auto 20px;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}
</style>
</head>

    if(!t0)t0=ts;const t=ts-t0;ctx.clearRect(0,0,W,H);
    if(t<T1){ // titik dan karakter mengalir ke ikon
      for(const p of parts){const x=-30+(t*p.sp)-p.d*.2+p.d*.0;const prog=Math.max(0,Math.min(1,(t*p.sp-p.d*.4)/(cx+30)));
        if(prog<=0)continue;const px=-20+prog*(cx+20),py=cy+p.y*(1-prog),sz=p.s*(1-prog*.6);
        ctx.fillStyle="#111";if(p.ch){ctx.font=Math.max(6,sz*3.2)+"px Roboto,sans-serif";ctx.fillText(p.ch,px,py)}else{ctx.beginPath();ctx.arc(px,py,sz/2,0,7);ctx.fill()}}
    }else{
      const k=t-T2;
      for(const d of dots){const e=Math.max(0,k-d.dl);d.r=Math.min(d.max*(1+ (e/1000)*d.g*10),e>0?d.max*(1+(e/1000)*d.g*9):0);
        if(d.r>0){ctx.fillStyle=colorAt(d.y,c);ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);ctx.fill()}}
      if(k>0&&!tx){tx=true;res.classList.add("txt")}
      if(k>900&&!sh){sh=true;res.classList.add("shrink")}
      if(t>T3&&!dn){dn=true;res.classList.add("load","done");setTimeout(()=>ctx.clearRect(0,0,W,H),950);fin=setTimeout(()=>show("final"),2700);return}
    }
    raf=requestAnimationFrame(f)}
  raf=requestAnimationFrame(f)
}
$("go").onclick=()=>run("");
$("again").onclick=()=>{cancelAnimationFrame(raf);clearTimeout(fin);show("welcome")};
</script>
